name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress: false a propósito. En "true" un push nuevo cancela el deploy
# en curso, que es lo que reventó el repo anterior con varios pushes seguidos: los
# deploys se pisaron, uno murió por timeout y el sitio se quedó sirviendo una
# versión antigua sin avisar. En "false" se encolan y se publican en orden.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
